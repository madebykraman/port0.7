name: Sync and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync portfolio source
        run: |
          git clone --depth 1 https://github.com/madebykraman/uniquequick001.git /tmp/source
          find /tmp/source -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec cp -a {} ./ \;
          rm -rf /tmp/source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync portfolio source [skip ci]"
            git push origin HEAD:main
          fi
      - name: Deploy to Vercel-compatible static output
        run: echo "Static portfolio source synced successfully"
